<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Window Size</title>
    <style>
        .tag{
            background-color: thistle;
            display: inline-block;
            padding: 16px;
            margin-top:16px;
            font-size: 48px;
        }
    </style>
</head>
<body>
    <div class="tag"> </div>
</body>
<script>
    const tag = document.querySelector('.tag')

    function updateTag(){
        tag.innerText = ` window.screen : ${window.screen.width}px ${window.screen.height}px
        window.outer : ${window.outerWidth}px ${window.outerHeight}px
        window.inner : ${window.innerWidth}px ${window.innerHeight}px
        documentElement.clientWidth : ${document.documentElement.clientWidth}px ${document.documentElement.clientHeight}px
        `
    }

    window.addEventListener('resize',updateTag)
    updateTag()
</script>
</html>
